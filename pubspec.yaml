name: mypengaduan_app
description: "Aplikasi Pengaduan Masyarakat Di Lingkungan RT 05 Gang Annur II - MyPengaduan"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI Components
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  
  # State Management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.6.2
  
  # HTTP & API
  dio: ^5.7.0
  
  # Local Storage
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  
  # Firebase
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.5
  firebase_analytics: ^11.3.8
  
  # Notifications
  flutter_local_notifications: ^18.0.1
  
  # Image Handling
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  file_picker: ^8.0.0
  
  # Date & Time
  intl: ^0.19.0
  
  # Utils
  url_launcher: ^6.3.1
  permission_handler: ^11.3.1
  connectivity_plus: ^6.1.0
  share_plus: ^10.1.3
  pdf: ^3.11.1
  excel: ^4.0.6
  
  # Loading & Dialogs
  flutter_spinkit: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#072314"
  adaptive_icon_foreground: "assets/images/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
